spring:
  datasource:
    # 테스트는 H2 인메모리 사용 (DB 컨테이너 의존성 X)
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

filter-service:
  base-url: http://localhost:9999    # 테스트 시 호출 안 함
  timeout-ms: 1000
