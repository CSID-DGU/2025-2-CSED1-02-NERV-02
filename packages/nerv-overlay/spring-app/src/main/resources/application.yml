spring:
  application:
    name: nerv-overlay-spring

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:nerv_overlay}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway 가 스키마 관리. JPA 는 검증만.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: false                # 운영은 false. 디버깅 시 true.
    open-in-view: false            # OSIV 비활성화 (best practice)

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 앱 자체 설정
app:
  # OBS Browser Source URL 의 host. 운영에선 Spring 의 public URL (Railway 도메인).
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  # OAuth callback 후 redirect 보낼 프론트엔드 도메인 (Vercel).
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # CORS 허용 Origin (쉼표/공백 구분). Vercel 의 preview 도메인은 패턴으로 추가 가능 (https://*.vercel.app).
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
  # JWT — 운영에서는 반드시 환경변수로 32자 이상 시크릿 주입
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-this-to-32-or-more-bytes-aaaaaaaa}
    # 7일
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}

# 외부 서비스
filter-service:
  base-url: ${FILTER_SERVICE_URL:http://localhost:8001}
  timeout-ms: 5000

chat-fetcher:
  base-url: ${CHAT_FETCHER_URL:http://localhost:8002}
  ws-url: ${CHAT_FETCHER_WS_URL:ws://localhost:8002}

# 서버
server:
  port: 8080

# 로깅
logging:
  level:
    com.nerv.overlay: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
