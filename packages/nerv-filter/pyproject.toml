[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "nerv-filter"
dynamic = ["version"]
description = "Korean profanity filter with morphological analysis (Kiwi + Aho-Corasick)"
authors = [
    {name = "NERV Team"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "korean", "profanity", "filter", "moderation",
    "nlp", "kiwi", "morphology", "aho-corasick",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Filters",
    "Natural Language :: Korean",
]
dependencies = [
    "kiwipiepy>=0.17.0",
    "pyahocorasick>=2.0.0",
]

[project.optional-dependencies]
cli = ["click>=8.0"]
# 2차 필터 (KcBERT + attention head) — 선택 설치. 1차만 쓰면 미설치로 가볍게 유지.
# torch >= 2.6.0: 학습된 head 체크포인트(.pt)가 새 직렬화 포맷.
ai = [
    "torch>=2.6.0",
    "transformers>=4.30",
    "huggingface-hub>=0.16",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "click>=8.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
nerv-filter = "nerv_filter.cli:main"

[project.urls]
Homepage = "https://github.com/CSID-DGU/2025-2-CSED1-02-NERV-02"
Repository = "https://github.com/CSID-DGU/2025-2-CSED1-02-NERV-02"

[tool.hatch.version]
path = "src/nerv_filter/_version.py"

[tool.hatch.build.targets.wheel]
# src/nerv_filter/ 안의 모든 파일 (.py, dict/*.json, models/**) 이 자동 포함된다.
packages = ["src/nerv_filter"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nerv_filter",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
