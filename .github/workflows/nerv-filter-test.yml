name: nerv-filter — Test

on:
  push:
    branches: [main]
    paths:
      - "packages/nerv-filter/**"
      - ".github/workflows/nerv-filter-*.yml"
  pull_request:
    paths:
      - "packages/nerv-filter/**"
      - ".github/workflows/nerv-filter-*.yml"

defaults:
  run:
    working-directory: packages/nerv-filter

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/nerv-filter/pyproject.toml

      - name: Install
        run: pip install -e ".[dev,cli]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest --cov=nerv_filter --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: packages/nerv-filter/coverage.xml
          flags: nerv-filter
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/nerv-filter/dist/
